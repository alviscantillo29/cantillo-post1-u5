# dosbox.conf - configuracion para laboratorio Post1 Unidad 5

[cpu]
core=normal
cputype=auto
cycles=8000       # velocidad adecuada y reproducible para trabajo con NASM

[dosbox]
memsize=16

[render]
scaler=normal2x   # escala la ventana 2x para mejor visibilidad

[autoexec]
# AJUSTAR la ruta al directorio real en el sistema anfitrion
mount c "C:\Users\usuario\cantillo-post1-u5"
c:
echo DOSBox listo. Directorio de trabajo: C:\
cls
